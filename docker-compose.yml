services:
  neo4j:
    image: neo4j:5.26.33-community
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687'
    environment:
      NEO4J_AUTH: 'neo4j/${NEO4J_PASSWORD:?Set a local Neo4j password in .env}'
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_bolt_advertised__address: 'localhost:${NEO4J_BOLT_PORT:-7687}'
      NEO4J_server_http_advertised__address: 'localhost:${NEO4J_HTTP_PORT:-7474}'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*,gds.*'
      NEO4J_dbms_security_procedures_unrestricted: 'gds.*'
      NEO4J_server_memory_heap_initial__size: '512m'
      NEO4J_server_memory_heap_max__size: '3g'
      NEO4J_server_memory_pagecache_size: '768m'
      NEO4J_dbms_usage__report_enabled: 'false'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import:ro

volumes:
  neo4j_data:
  neo4j_logs:
